[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-dev-researcher"
version = "0.1.0"
description = "DeepAgents AI development research system (clean-room implementation)."
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.10",
  "pydantic-settings>=2.6",
  "aiosqlite>=0.20",
  "python-dotenv>=1.0",
  "aiofiles>=24.1",
  "httpx>=0.28",
  "pypdf>=5.0",
  "python-docx>=1.1",
  "python-multipart>=0.0.12",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
]
agent = [
  "deepagents==0.6.12",
  "langchain>=1.3.11,<2",
  "langchain-core>=1.4.8,<2",
  "langchain-deepseek==1.1.0",
  "tavily-python>=0.5",
]
rag = [
  "docling>=2.0",
  "sentence-transformers>=3.0",
  "chromadb>=0.5",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["src"]
